events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    server {
        listen 80;
        server_name alexandrapalacios.com www.alexandrapalacios.com;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 404 for missing pages (matches Astro's static 404.astro)
        error_page 404 /404.html;

        # Canonical: always trailing slash (matches Astro static build + sitemap).
        # Redirect /foo -> /foo/ (301) for bare paths; leave file requests with
        # extensions untouched (.js, .css, .jpg, .xml, ...).
        location / {
            if ($request_uri ~ ^([^.?]*[^/])(\?.*)?$) {
                return 301 $1/$2;
            }
            try_files $uri $uri/index.html =404;
        }

        # Cache static assets aggressively (fingerprinted by Astro build)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML: revalidate on every request so stale redirects don't linger
        location ~* \.html$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # Crawler files
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        location = /sitemap-index.xml {
            access_log off;
            log_not_found off;
        }

        location = /sitemap-0.xml {
            access_log off;
            log_not_found off;
        }
    }
}
